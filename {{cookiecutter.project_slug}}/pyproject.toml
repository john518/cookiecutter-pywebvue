[project]
name = "{{project_name}}"
version = "0.1.0"
description = "A pywebview desktop application"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pywebview>=4.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["{{project_name_safe}}"]
